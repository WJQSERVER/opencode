name: fork release
run-name: "fork release ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'official latest' }}"

# Independent release pipeline for this fork. Upstream's release.yml is bound to
# anomalyco/opencode (signing, R2, attestation); this one builds, attaches binaries to a
# GitHub release, and optionally publishes the fork's npm packages under @wjqserver/*.
# Versions follow the official releases: the version must be an official @opencode/cli
# release (a manual run with no version takes the latest), and the release tag uses the
# official `v` prefix. Pushing a `v*` tag whose commit is on master cuts that release.
on:
  # Tags on master cut a release: the tag name is the verified official version.
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Official upstream version to release (e.g. 2.2.6); empty = latest official"
        required: false
        type: string
      channel:
        description: "Channel; also the npm dist-tag"
        required: false
        type: string
        default: "latest"
      targets:
        description: "Comma-separated build targets"
        required: false
        type: string
        default: "linux-x64"
      create_release:
        description: "Attach binaries to a GitHub release"
        required: false
        type: boolean
        default: true
      publish_npm:
        description: "Publish the npm packages (requires NPM_TOKEN secret)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version }}-${{ github.event.inputs.targets }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  OPENCODE_CHANNEL: ${{ inputs.channel || 'latest' }}
  OPENCODE_RELEASE: false
  OPENCODE_MODELS_URL: https://models.dev

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch master
        if: ${{ github.ref_type == 'tag' }}
        run: git fetch origin master:refs/remotes/origin/master

      - id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag runs carry no inputs: the tag name is the version, and it must sit on master's history.
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}" 2>/dev/null || echo "$GITHUB_SHA")
            if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/master; then
              echo "tag $REF_NAME ($commit) is not on master's history" >&2
              git branch -r --contains "$commit" >&2 || true
              exit 1
            fi
          else
            version="${VERSION_INPUT#v}"
          fi
          if [ -z "$version" ]; then
            version=$(npm view @opencode/cli version)
            echo "releasing the latest official version: $version"
          elif [ "$(npm view "@opencode/cli@$version" version 2>/dev/null || true)" != "$version" ]; then
            echo "version $version is not an official release; dispatch without a version to use the latest official one" >&2
            exit 1
          else
            echo "releasing official version: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  build:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build targets
        run: |
          targets="${{ inputs.targets || 'linux-x64' }}"
          mkdir -p packages/cli/dist
          # Each invocation clears its --outdir, so targets build into separate trees and are
          # collected below into the single dist/ root that pack expects.
          for target in $(echo "$targets" | tr ',' ' '); do
            echo "building $target"
            OPENCODE_TARGET="$target" packages/cli/script/build.ts --outdir="dist-build/$target"
            mv "packages/cli/dist-build/$target/opencode-$target" "packages/cli/dist/"
          done
          ls -1 packages/cli/dist

      - name: Pack npm packages and archives
        run: packages/cli/script/pack.ts

      - name: Write checksums
        run: |
          cd dist
          sha256sum archives/* npm/*.tgz > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/archives/
            dist/npm/
            dist/checksums.txt

  release:
    # Tag runs always publish their release; dispatch runs opt in.
    if: ${{ inputs.create_release || github.ref_type == 'tag' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber archives/* npm/*.tgz checksums.txt
          elif [ "$REF_TYPE" = "tag" ]; then
            # The tag already exists remotely; bind the release to it through the API.
            prerelease=false
            [ "$PRERELEASE" = true ] && prerelease=true
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f "name=opencode $TAG" \
              -F prerelease="$prerelease" \
              -F generate_release_notes=true
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber archives/* npm/*.tgz checksums.txt
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "opencode $TAG" \
              --generate-notes \
              "${flags[@]}" archives/* npm/*.tgz checksums.txt
          fi

  publish-npm:
    if: ${{ inputs.publish_npm }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ inputs.channel || 'latest' }}
        # Platform packages publish before the wrapper: the wrapper's optionalDependencies resolve
        # against them. An already-published version is skipped so re-runs stay idempotent.
        run: |
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          shopt -s nullglob
          publish() {
            local file=$1
            local name
            name=$(tar -xzOf "$file" package/package.json | jq -r .name)
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "already published $name@$VERSION"
              return
            fi
            # npm only treats a path as a tarball with the ./ prefix; a bare relative path reads as a package spec.
            npm publish "./$file" --tag "$TAG" --access public --ignore-scripts
          }
          wrappers=()
          platforms=()
          for file in npm/*.tgz; do
            name=$(tar -xzOf "$file" package/package.json | jq -r .name)
            if [ "$name" = "@wjqserver/opencode" ]; then wrappers+=("$file"); else platforms+=("$file"); fi
          done
          for file in "${platforms[@]}"; do publish "$file"; done
          for file in "${wrappers[@]}"; do publish "$file"; done
